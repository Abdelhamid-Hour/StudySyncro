<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Home Page</title>
  </head>
  <body>
    <aside class="top-side-bar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Overview</h2>
        <div class="navigation-tabs">
          <button
            type="button"
            class="tab my-groups-tab active-tab exclude-btn"
          >
            My Groups
          </button>
          <button type="button" class="tab available-groups-tab exclude-btn">
            Available Groups
          </button>
        </div>
      </div>
      <!-- Overview -->
      <!-- <div class="greeting-msg">
        <h2>Hello Abdelhamid Hour 👋</h2>
        <p>Have a good day !</p>
      </div> -->

      <div class="search-container">
        <div class="search">
          <div class="search-icon-container">
            <i class="bi bi-search"></i>
          </div>
          <input type="search" placeholder="Search By Grourp Name" />
        </div>
        <div class="filter-container">
          <button type="button" class="exclude-btn filter-button should-fill">
            <i class="bi bi-funnel"></i>
          </button>
          <div class="filter-panel overlay user-group-filter-panel">
            <section class="filter-section">
              <h4 class="filter-title">Role</h4>
              <div class="filter-option">
                <input type="checkbox" id="admin" />
                <label for="admin">
                  <i class="bi bi-person-gear"></i>
                Admin
                </label>
                </div>
                <div class="filter-option">
                <input type="checkbox" id="member" />
                <label for="member">
                <i class="bi bi-person"></i>
                Member
                </label>
              </div>
            </section>
            <section class="filter-section">
              <h4 class="filter-title">Visibility</h4>
              <div class="filter-option">
                <input type="checkbox" id="private" />
                <label for="private">
                  <i class="bi bi-lock"></i>
                  Private
                </label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="public" />
                <label for="public">
                  <i class="bi bi-eye"></i>
                  Public
                </label>
              </div>
            </section>
            <section class="filter-section">
              <h4 class="filter-title">Level</h4>
              <div class="filter-option">
                <input type="checkbox" id="advanced" />
                <label for="advanced">
                  <i class="bi bi-graph-up"></i>
                  Advanced
                </label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="intermediate" />
                <label for="intermediate">
                  <i class="bi bi-bar-chart"></i>
                  Intermediate
                </label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="beginner" />
                <label for="beginner">
                  <i class="bi bi-lightbulb"></i>
                  Beginner
                </label>
              </div>
            </section>
            <section class="filter-section">
              <h4 class="filter-title">Search By</h4>
              <div class="filter-option">
                <input type="radio" name="search-by" id="group-name" />
                <label for="group-name">
                  <i class="bi bi-fonts"></i>
                  Group Name
                </label>
              </div>
              <div class="filter-option">
                <input type="radio" name="search-by" id="subject" />
                <label for="subject">
                  <i class="bi bi-book"></i>
                  Subject
                </label>
              </div>
            </section>
          </div>
          <div class="filter-panel overlay group-filter-panel">
            <section class="filter-section">
              <h4 class="filter-title">Visibility</h4>
              <div class="filter-option">
                <input type="checkbox" id="private" />
                <label for="private">
                  <i class="bi bi-incognito"></i>
                  Private
                </label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="public" />
                <label for="public">
                  <i class="bi bi-eye"></i>
                  Public
                </label>
              </div>
            </section>
            <section class="filter-section">
              <h4 class="filter-title">Level</h4>
              <div class="filter-option">
                <input type="checkbox" id="advanced" />
                <label for="advanced">
                  <i class="bi bi-graph-up"></i>
                  Advanced
                </label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="intermediate" />
                <label for="intermediate">
                  <i class="bi bi-bar-chart"></i>
                  Intermediate
                </label>
              </div>
              <div class="filter-option">
                <input type="checkbox" id="beginner" />
                <label for="beginner">
                  <i class="bi bi-lightbulb"></i>
                  Beginner
                </label>
              </div>
            </section>
            <section class="filter-section">
              <h4 class="filter-title">Search By</h4>
              <div class="filter-option">
                <input type="radio" name="search-by" id="group-name" />
                <label for="group-name">
                  <i class="bi bi-fonts"></i>
                  Group Name
                </label>
              </div>
              <div class="filter-option">
                <input type="radio" name="search-by" id="subject" />
                <label for="subject">
                  <i class="bi bi-book"></i>
                  Subject
                </label>
              </div>
            </section>
          </div>
        </div>
      </div>
      <div class="profile-container">
        <button type="button" class="profile-btn exclude-btn should-fill">
          <i class="bi bi-person-circle exclude-icon"></i>
          <div class="profile-info">
            <span>Abdelhamid Hour</span>
            <span>hourabdelhamid403@gmail.com</span>
          </div>
          <i class="bi bi-caret-down"></i>
        </button>
        <ul class="profile-drop-down-menu overlay">
          <li class="account should-fill">
            <a href="/settings">
              <i class="bi bi-person"></i>
              Account
            </a>
          </li>
          <li class="groups should-fill">
            <a href="/groups">
              <i class="bi bi-people"></i>
              My Groups
            </a>
          </li>
          <li class="quizzes should-fill">
            <a href="quizzes">
              <i class="bi bi-clipboard-check"></i>
              My Quizzes
            </a>
          </li>
          <li class="logout account">
            <button type="button">
              <i class="bi bi-box-arrow-in-left"></i>
              Logout
            </button>
          </li>
        </ul>
      </div>
    </aside>
    <aside class="left-side-bar">
      <div class="logo-container">
        <i class="bi bi-box-fill"></i>
        <h5 class="should-hide">StudyHype</h5>
      </div>
      <div class="side-bar-icons">
        <div class="top-side-bar-icons">
          <div class="home-container should-fill">
            <i class="bi bi-house"></i>
            <h3 class="should-hide">OverView</h3>
          </div>
          <div class="groupe-container should-fill active">
            <i class="bi bi-people"></i>
            <h3 class="should-hide">Groups</h3>
          </div>
          <div class="quizzes-container should-fill">
            <i class="bi bi-clipboard-check"></i>
            <h3 class="should-hide">Quizzes</h3>
          </div>
        </div>
        <div class="bottom-side-bar-icons">
          <div class="toggle-container">
            <i class="bi bi-toggle-off"></i>
          </div>
          <div class="notification-container should-fill">
            <i class="bi bi-bell"></i>
          </div>
          <div class="open-close-container">
            <i class="bi bi-layout-sidebar"></i>
          </div>
          <div class="settings-container should-fill">
            <i class="bi bi-gear"></i>
          </div>
        </div>
      </div>
    </aside>
    <main>
      
    </main>
    <div id="tooltip" role="tooltip"></div>

    <script type="module" src="./assets/global/js/getNodes.js"></script>
