    <style>
      .add-member-overlay {
        position: relative;
        display: flex;
        height: 40rem;
        width: 30rem;
        flex-direction: column;
        gap: var(--primary-gap);
        background-color: var(--container-background-color);
        border-radius: calc(var(--primary-radius) * 2);
        padding: var(--primary-gap);
        border: var(--primary-border-style);
        box-shadow: var(--primary-shadow);

        header {
          display: flex;
          justify-content: space-between;
          align-items: center;

          .label {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
            color: var(--primary-color);
          }

          .close-overlay-btn {
            &:hover {
              background-color: var(--btn-background-color);
              box-shadow: var(--primary-shadow);
            }
          }
        }

        .users-search {
          width: 100%;
        }

        .text-helper {
          font-size: var(--small-font-size);
          color: var(--secondary-text-color);
        }

        .search-sec {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: var(--primary-gap);
        }

        .action-btns {
          display: flex;
          justify-content: center;
          gap: var(--primary-gap);
          width: fit-content;
          margin-left: auto;
          margin-top: auto;
        }

        .selected-users {
          display: flex;
          flex-wrap: wrap;
          gap: calc(var(--primary-gap) / 2);
          overflow: hidden;
          background-color: var(--background-color);
          padding: var(--primary-gap);
          border-radius: var(--primary-radius);
          height: 5rem;
          min-height: 5rem;
          overflow: auto;
          scrollbar-width: none;
          border: var(--primary-border-style);

          .user-badge {
            position: relative;
            border-radius: 1rem;
            padding: 0.2rem;
            padding-right: 0.4rem;
            background-color: var(--btn-background-color);
            margin-bottom: calc(var(--primary-gap) / 2);
            margin-right: calc(var(--primary-gap) / 2);

            &:last-child {
              margin-right: auto;
            }

            .remove-btn {
              position: absolute;
              top: 0;
              right: 0;
              translate: 50% -50%;
              z-index: 1;
              padding: 0;
              border-radius: 50%;
              background-color: var(--btn-background-color);
              &:hover {
                box-shadow: var(--primary-shadow);
                background-color: color-mix(
                  in srgb,
                  var(--btn-background-color) 80%,
                  var(--primary-text-color)
                );
              }
            }

            .avatar {
              height: 1.5rem;
              width: 1.5rem;
            }
          }
        }

        .users-result {
          display: flex;
          flex-direction: column;
          gap: var(--primary-gap);
          overflow: auto;
          scrollbar-width: none;
          padding: 0.1rem;

          .user-item {
            display: flex;
            width: 100%;
            gap: var(--primary-gap);
            padding-block: calc(var(--primary-gap) / 2);
            padding-inline: var(--primary-gap);
            border-radius: var(--primary-radius);
            align-items: center;
            outline: var(--primary-border-style);
            transition: var(--primary-transition-style);

            &:hover {
              background-color: var(--background-color);
            }

            .avatar {
              height: 2rem;
              width: 2rem;
            }
          }
        }
      }
    </style>
