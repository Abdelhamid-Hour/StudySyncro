<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../main_assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="../../../main_assets/css/variables_and_fonts.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../global/css/styles.css" />
    <link rel="stylesheet" href="./passed/css/styles.css" />
    <link rel="stylesheet" href="../shared/quizzes-my-groups/css/styles.css" />
    <link rel="stylesheet" href="../shared/quizzes-groups/css/styles.css" />
  </head>
  <body>
    <style></style>
    <div class="quizzes-list fade-in-template">
      <div class="quiz-card">
        <div class="quiz-title-container info-container">
          <label class="quiz-title-label">
            <span class="icon-box"><i class="bi bi-card-text"></i></span>
            Quiz Title
          </label>
          <div class="quiz-title content">Quiz Saving test</div>
        </div>
        <div class="score-container info-container">
          <label class="score-label">
            <span class="icon-box">
              <i class="bi bi-trophy"></i>
            </span>
            Score
          </label>
          <div class="score content">85%</div>
        </div>
        <div class="group-name-container info-container">
          <label class="group-name-label">
            <span class="icon-box">
              <i class="bi bi-people"></i>
            </span>
            Group Name
          </label>
          <div class="group-name content">Group Alpha</div>
        </div>
        <div class="submitted-at-container info-container">
          <label class="submitted-at-label">
            <span class="icon-box">
              <i class="bi bi-calendar-check"></i>
            </span>
            Submitted At
          </label>
          <div class="submitted-at content">2024-06-10 14:30</div>
        </div>
        <div class="session-name-container info-container">
          <label class="session-name-label">
            <span class="icon-box">
              <i class="bi bi-journal-bookmark"></i>
            </span>
            Session Name
          </label>
          <div class="session-name content">Session 1</div>
        </div>

        <div class="action-btns">
          <button class="view-quiz-result-btn">
            <i class="bi bi-eye"></i>
            View Result
          </button>
          <button class="retake-quiz-btn">
            <i class="bi bi-arrow-repeat"></i>
            Retake
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../shared/quiz/js/main.js"></script>
    <script type="module" src="../global/js/main.js"></script>
  </body>
</html>
