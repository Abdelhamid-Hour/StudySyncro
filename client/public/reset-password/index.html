<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch(e) {}
      })();
    </script>
    <title>Reset Your Password</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Prevent indexing for security -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- SEO & Page Information -->
    <meta name="title" content="Reset Your Password - StudyHive" />
    <meta
      name="description"
      content="Reset your password securely for your StudyHive account. Enter your email to receive a reset link."
    />
    <meta name="author" content="StudyHive Team" />

    <!-- Favicon -->
    <!-- TODO: adjust the link of icon image -->
    <link rel="icon" type="image/png" href="https://example.com/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="https://example.com/apple-touch-icon.png"
    />
    <!-- Preloading Critical Resources -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      as="style"
    />
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      as="style"
    />
    <link
      rel="preload"
      href="../main_assets/css/variables_and_fonts.css"
      as="style"
    />
    <link rel="preload" href="../main_assets/css/styles.css" as="style" />
    <link rel="preload" href="./assets/css/styles.css" as="style" />
    <link
      rel="modulepreload"
      href="./assets/js/main.js"
      as="script"
      crossorigin="anonymous"
    />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../main_assets/css/variables_and_fonts.css" />
    <link rel="stylesheet" href="../main_assets/css/styles.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <!-- font -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <a
      href="/"
      class="login-top-logo button exclude-btn"
      style="
        position: absolute;
        top: 1.5rem;
        left: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        z-index: 999;
        text-decoration: none;
        padding: 0.45rem 1rem;
        border-radius: 5px;
        border: 1px solid var(--btn-border-color);
        background-color: var(--btn-background-color);
        color: var(--heading-color);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
      "
    >
      <img
        src="../main_assets/images/logo-mark.svg"
        alt="StudyHype Logo"
        style="width: 1.8rem; height: 1.8rem"
      />
      <span
        style="
          font-size: 1.25rem;
          font-weight: 800;
          color: var(--heading-color);
          letter-spacing: -0.5px;
        "
        >StudyHype</span
      >
    </a>
    <div class="top-nav-bar" style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.8rem; z-index: 999;">
      <a href="/" class="button exclude-btn" title="Back to Home" aria-label="Back to Home" style="padding: 0.5rem 1rem; border-radius: 5px; border: 1px solid var(--btn-border-color); background-color: var(--btn-background-color); color: var(--btn-text-color); display: flex; align-items: center; gap: 0.5rem; text-decoration: none;">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
      </a>
      <button class="button exclude-btn toggle-theme-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Dark or Light Mode" style="padding: 0.5rem 0.8rem; border-radius: 5px; border: 1px solid var(--btn-border-color); background-color: var(--btn-background-color); color: var(--btn-text-color); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <i class="bi bi-moon theme-toggle-icon" id="theme-toggle-icon"></i>
      </button>
    </div>
    <main>
      <h2>Reset Your Password</h2>
      <form>
        <div class="password-container">
          <div class="md-password-container">
            <div>
              <i class="bi bi-lock-fill"></i>
            </div>
            <div class="password-container-label">
              <label for="password">
                <div></div>
                New Password
              </label>
              <input
                placeholder=""
                type="password"
                class="password"
                id="password"
                required
                autocomplete="off"
              />
              <div class="eye-icon">
                <i class="bi bi-eye-fill"></i>
                <div>
                  <hr />
                </div>
              </div>
            </div>
          </div>
          <div class="error-container">
            <span class="error-msg"></span>
          </div>
        </div>
        <div class="password-container">
          <div class="md-password-container">
            <div>
              <i class="bi bi-lock-fill"></i>
            </div>
            <div class="password-container-label">
              <label for="confirm-password">
                <div></div>
                Confirm Password
              </label>
              <input
                placeholder=""
                type="password"
                class="password"
                id="confirm-password"
                required
                autocomplete="off"
              />
              <div class="eye-icon">
                <i class="bi bi-eye-fill"></i>
                <div>
                  <hr />
                </div>
              </div>
            </div>
          </div>
          <div class="error-container">
            <span class="error-msg"></span>
          </div>
        </div>
        <button id="reset-password-btn" type="button">Reset Password</button>
      </form>
    </main>
    <script
      type="module"
      src="./assets/js/main.js"
      crossorigin="anonymous"
    ></script>

    <!-- Native Theme Switcher Script -->
    <script>
      (function() {
        const toggleBtn = document.getElementById("theme-toggle-btn");
        const toggleIcon = document.getElementById("theme-toggle-icon");
        const root = document.documentElement;

        const savedTheme = localStorage.getItem("theme") || "light";
        applyTheme(savedTheme === "dark");

        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            const isDark = root.getAttribute("data-theme") === "dark";
            applyTheme(!isDark, true);
          });
        }

        function applyTheme(toDark, save) {
          const theme = toDark ? "dark" : "light";
          root.setAttribute("data-theme", theme);
          if (toggleIcon) toggleIcon.className = toDark ? "bi bi-sun theme-toggle-icon" : "bi bi-moon theme-toggle-icon";
          if (save) {
            try {
              localStorage.setItem("theme", theme);
              localStorage.setItem("mode", theme);
              localStorage.setItem("studyhype_theme", theme);
            } catch (e) {}
          }
        }
      })();
    </script>
  </body>
</html>
