<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#16191f; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="q-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e77fd"/>
      <stop offset="100%" stop-color="#9235e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="40" y="40" width="520" height="320" rx="16" fill="#1f232d" stroke="#2e3440" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Quiz Top Bar -->
  <text x="70" y="80" fill="#a0a8b8" font-size="12" font-weight="600">QUIZ PLAY MODE • QUESTION 4 OF 10</text>
  <rect x="430" y="62" width="100" height="26" rx="13" fill="#262b36"/>
  <text x="480" y="79" fill="#ffbd2e" font-size="12" font-weight="700" text-anchor="middle">⏱ 08 : 45</text>
  
  <!-- Progress Bar -->
  <rect x="70" y="95" width="460" height="6" rx="3" fill="#15181f"/>
  <rect x="70" y="95" width="184" height="6" rx="3" fill="url(#q-grad)"/>

  <!-- Question Box -->
  <text x="70" y="135" fill="#ffffff" font-size="17" font-weight="700">Which CSS property is used to create a glassmorphism blur effect?</text>
  
  <!-- Options -->
  <!-- Option A -->
  <rect x="70" y="160" width="460" height="42" rx="8" fill="#262b36" stroke="#363c4b" stroke-width="1"/>
  <circle cx="95" cy="181" r="10" fill="#15181f" stroke="#525866" stroke-width="1.5"/>
  <text x="120" y="186" fill="#d1d5db" font-size="14" font-family="monospace">filter: blur(10px);</text>

  <!-- Option B (Selected/Correct) -->
  <rect x="70" y="212" width="460" height="42" rx="8" fill="#1e3a68" fill-opacity="0.6" stroke="#27c93f" stroke-width="2"/>
  <circle cx="95" cy="233" r="10" fill="#27c93f"/>
  <path d="M91 233 L94 236 L100 230" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="120" y="238" fill="#ffffff" font-size="14" font-weight="600" font-family="monospace">backdrop-filter: blur(10px);</text>
  <text x="490" y="238" fill="#27c93f" font-size="12" font-weight="700">✓ Correct</text>

  <!-- Option C -->
  <rect x="70" y="264" width="460" height="42" rx="8" fill="#262b36" stroke="#363c4b" stroke-width="1"/>
  <circle cx="95" cy="285" r="10" fill="#15181f" stroke="#525866" stroke-width="1.5"/>
  <text x="120" y="290" fill="#d1d5db" font-size="14" font-family="monospace">background-blend-mode: blur;</text>

  <!-- Bottom Buttons -->
  <rect x="390" y="318" width="140" height="32" rx="6" fill="url(#q-grad)"/>
  <text x="460" y="338" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Next Question →</text>
</svg>
