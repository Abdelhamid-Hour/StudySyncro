<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#16191f; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="t-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e77fd"/>
      <stop offset="100%" stop-color="#9235e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="40" y="40" width="520" height="320" rx="16" fill="#1f232d" stroke="#2e3440" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Left Column: Circular Timer -->
  <g transform="translate(160, 180)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#262b36" stroke-width="12"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#t-grad)" stroke-width="12" stroke-dasharray="534" stroke-dashoffset="133" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="-10" fill="#ffffff" font-size="28" font-weight="700" font-family="monospace" text-anchor="middle">25 : 00</text>
    <text x="0" y="15" fill="#4fa0ff" font-size="12" font-weight="600" text-anchor="middle">FOCUS SESSION #3</text>
    <rect x="-45" y="32" width="90" height="24" rx="12" fill="#27c93f" fill-opacity="0.2"/>
    <text x="0" y="48" fill="#27c93f" font-size="11" font-weight="700" text-anchor="middle">● ACTIVE</text>
  </g>

  <!-- Right Column: Task Checklist -->
  <g transform="translate(290, 80)">
    <text x="0" y="0" fill="#ffffff" font-size="16" font-weight="700">Session Objectives</text>
    <text x="0" y="20" fill="#8e96a8" font-size="12">Keep track of your study milestones</text>
    
    <!-- Task 1 (Done) -->
    <rect x="0" y="40" width="230" height="45" rx="8" fill="#262b36" stroke="#27c93f" stroke-width="1"/>
    <circle cx="20" cy="62" r="9" fill="#27c93f"/>
    <path d="M16 62 L19 65 L25 59" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="40" y="66" fill="#a0a8b8" font-size="13" text-decoration="line-through">Review Lecture Slides</text>

    <!-- Task 2 (Current) -->
    <rect x="0" y="95" width="230" height="55" rx="8" fill="#1e3a68" fill-opacity="0.5" stroke="#1e77fd" stroke-width="1.5"/>
    <circle cx="20" cy="122" r="9" fill="none" stroke="#1e77fd" stroke-width="2"/>
    <circle cx="20" cy="122" r="4" fill="#1e77fd"/>
    <text x="40" y="118" fill="#ffffff" font-size="13" font-weight="600">Solve 5 Practice Problems</text>
    <text x="40" y="135" fill="#4fa0ff" font-size="11" font-weight="600">In Progress...</text>

    <!-- Task 3 (Pending) -->
    <rect x="0" y="160" width="230" height="45" rx="8" fill="#262b36" opacity="0.6"/>
    <circle cx="20" cy="182" r="9" fill="none" stroke="#525866" stroke-width="2"/>
    <text x="40" y="187" fill="#8e96a8" font-size="13">Summarize Key Formulas</text>

    <!-- Add Task Btn -->
    <rect x="0" y="220" width="230" height="36" rx="8" fill="#242832" stroke="#363c4b" stroke-dasharray="4"/>
    <text x="115" y="243" fill="#1e77fd" font-size="12" font-weight="600" text-anchor="middle">+ Add New Task</text>
  </g>
</svg>
