<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#13151a; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e77fd"/>
      <stop offset="100%" stop-color="#9235e8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242832" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e222a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with glowing orb effect -->
  <rect width="1200" height="750" fill="url(#bg-grad)" rx="16"/>
  <circle cx="950" cy="150" r="180" fill="#9235e8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="250" cy="600" r="220" fill="#1e77fd" opacity="0.15" filter="url(#glow)"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#181b22" rx="16"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="600" y="28" fill="#717888" font-size="13" text-anchor="middle" font-weight="500">app.studyhype.com/home</text>

  <!-- Left Sidebar -->
  <rect x="0" y="48" width="240" height="702" fill="#16191f"/>
  <line x1="240" y1="48" x2="240" y2="750" stroke="#232833" stroke-width="1"/>
  
  <!-- Sidebar Brand -->
  <g transform="translate(24, 75)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#accent-grad)"/>
    <path d="M10 22 L16 10 L22 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="44" y="22" fill="#ffffff" font-size="18" font-weight="700">StudyHype</text>
  </g>

  <!-- Sidebar Nav Items -->
  <g transform="translate(16, 135)">
    <!-- Active Item -->
    <rect x="0" y="0" width="208" height="42" rx="8" fill="url(#accent-grad)"/>
    <text x="44" y="26" fill="#ffffff" font-size="14" font-weight="600">Home Dashboard</text>
    <circle cx="24" cy="21" r="5" fill="#ffffff"/>
    
    <!-- Inactive Items -->
    <g transform="translate(0, 52)">
      <text x="44" y="26" fill="#8e96a8" font-size="14" font-weight="500">My Study Groups</text>
      <circle cx="24" cy="21" r="5" fill="#525866"/>
      <rect x="160" y="8" width="36" height="24" rx="12" fill="#242832"/>
      <text x="178" y="24" fill="#1e77fd" font-size="11" font-weight="700" text-anchor="middle">5</text>
    </g>
    <g transform="translate(0, 104)">
      <text x="44" y="26" fill="#8e96a8" font-size="14" font-weight="500">Quizzes &amp; Exams</text>
      <circle cx="24" cy="21" r="5" fill="#525866"/>
    </g>
    <g transform="translate(0, 156)">
      <text x="44" y="26" fill="#8e96a8" font-size="14" font-weight="500">Live Discussions</text>
      <circle cx="24" cy="21" r="5" fill="#525866"/>
      <circle cx="180" cy="21" r="4" fill="#27c93f"/>
    </g>
    <g transform="translate(0, 208)">
      <text x="44" y="26" fill="#8e96a8" font-size="14" font-weight="500">Study Timers</text>
      <circle cx="24" cy="21" r="5" fill="#525866"/>
    </g>
  </g>

  <!-- Sidebar User Profile Bottom -->
  <rect x="16" y="670" width="208" height="56" rx="10" fill="#1d212a"/>
  <circle cx="44" cy="698" r="16" fill="#9235e8"/>
  <text x="44" y="703" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">AH</text>
  <text x="72" y="694" fill="#ffffff" font-size="13" font-weight="600">Abdelhamid</text>
  <text x="72" y="710" fill="#27c93f" font-size="11" font-weight="500">● Online</text>

  <!-- Main Content Area -->
  <g transform="translate(276, 80)">
    <!-- Header Title & Status -->
    <text x="0" y="25" fill="#ffffff" font-size="24" font-weight="700">Active Study Session</text>
    <text x="0" y="48" fill="#8e96a8" font-size="14">Collaborating with Advanced Web Dev Group • Session #402</text>
    
    <!-- Timer Widget Top Right -->
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="240" height="56" rx="10" fill="#1f232d" stroke="#2f3542" stroke-width="1"/>
      <text x="20" y="34" fill="#ffffff" font-size="18" font-weight="700" font-family="monospace">01 : 45 : 20</text>
      <rect x="135" y="12" width="85" height="32" rx="6" fill="url(#accent-grad)"/>
      <text x="177" y="33" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Complete Task</text>
    </g>

    <!-- Content Grid Row 1 -->
    <!-- Left Card: Group Live Discussion Preview -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="550" height="380" rx="12" fill="url(#card-grad)" stroke="#2e3440" stroke-width="1" filter="url(#shadow)"/>
      <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="600">Live Group Chat</text>
      <circle cx="505" cy="30" r="4" fill="#27c93f"/>
      <text x="490" y="34" fill="#27c93f" font-size="12" font-weight="500" text-anchor="end">12 active</text>
      <line x1="0" y1="55" x2="550" y2="55" stroke="#2e3440" stroke-width="1"/>
      
      <!-- Chat Message 1 -->
      <circle cx="40" cy="95" r="14" fill="#1e77fd"/>
      <text x="40" y="100" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">JS</text>
      <text x="65" y="90" fill="#ffffff" font-size="13" font-weight="600">Sarah Jenkins</text>
      <text x="160" y="90" fill="#6c7380" font-size="11">10:42 AM</text>
      <rect x="65" y="100" width="450" height="42" rx="8" fill="#191c24"/>
      <text x="80" y="125" fill="#d1d5db" font-size="13">Hey everyone! Did anyone solve question #4 on the React hooks quiz?</text>
      
      <!-- Chat Message 2 (User) -->
      <circle cx="40" cy="175" r="14" fill="#9235e8"/>
      <text x="40" y="180" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">ME</text>
      <text x="65" y="170" fill="#ffffff" font-size="13" font-weight="600">You</text>
      <text x="95" y="170" fill="#6c7380" font-size="11">10:44 AM</text>
      <rect x="65" y="180" width="450" height="55" rx="8" fill="#1e3a68" fill-opacity="0.4" stroke="#1e77fd" stroke-width="0.5"/>
      <text x="80" y="202" fill="#ffffff" font-size="13">Yes! Make sure to include the state variable in the dependency array</text>
      <text x="80" y="222" fill="#ffffff" font-size="13">so useEffect triggers properly when it updates. 💡</text>

      <!-- Chat Message 3 -->
      <circle cx="40" cy="265" r="14" fill="#27c93f"/>
      <text x="40" y="270" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">MK</text>
      <text x="65" y="260" fill="#ffffff" font-size="13" font-weight="600">Mark K.</text>
      <text x="120" y="260" fill="#6c7380" font-size="11">10:45 AM</text>
      <rect x="65" y="270" width="380" height="38" rx="8" fill="#191c24"/>
      <text x="80" y="294" fill="#d1d5db" font-size="13">Thanks! Uploading my notes for chapter 5 now 📁</text>

      <!-- Chat Input Box -->
      <rect x="20" y="325" width="510" height="40" rx="20" fill="#15181f" stroke="#2e3440" stroke-width="1"/>
      <text x="40" y="350" fill="#6c7380" font-size="13">Type your message to the group...</text>
      <circle cx="510" cy="345" r="15" fill="url(#accent-grad)"/>
      <path d="M506 345 L514 345 M511 342 L514 345 L511 348" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Right Card: Ongoing Quiz / Task Checklist -->
    <g transform="translate(580, 85)">
      <rect x="0" y="0" width="300" height="380" rx="12" fill="url(#card-grad)" stroke="#2e3440" stroke-width="1" filter="url(#shadow)"/>
      <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="600">Active Tasks &amp; Quizzes</text>
      <line x1="0" y1="55" x2="300" y2="55" stroke="#2e3440" stroke-width="1"/>

      <!-- Task 1 -->
      <rect x="20" y="75" width="260" height="65" rx="8" fill="#191c24" stroke="#27c93f" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="45" cy="107" r="10" fill="#27c93f" fill-opacity="0.2"/>
      <path d="M40 107 L44 111 L51 103" stroke="#27c93f" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="70" y="100" fill="#ffffff" font-size="13" font-weight="600">Read Chapter 4 Notes</text>
      <text x="70" y="120" fill="#27c93f" font-size="11" font-weight="500">Completed 15m ago</text>

      <!-- Task 2 (Active Quiz) -->
      <rect x="20" y="155" width="260" height="95" rx="8" fill="#1e2536" stroke="#1e77fd" stroke-width="1.5"/>
      <rect x="200" y="167" width="65" height="20" rx="10" fill="#1e77fd" fill-opacity="0.2"/>
      <text x="232" y="181" fill="#4fa0ff" font-size="10" font-weight="700" text-anchor="middle">IN PROGRESS</text>
      <text x="40" y="182" fill="#ffffff" font-size="14" font-weight="600">React State Mastery</text>
      <text x="40" y="202" fill="#a0a8b8" font-size="12">15 Questions • 20 Mins</text>
      
      <!-- Progress Bar -->
      <rect x="40" y="220" width="220" height="6" rx="3" fill="#15181f"/>
      <rect x="40" y="220" width="160" height="6" rx="3" fill="url(#accent-grad)"/>
      <text x="260" y="215" fill="#ffffff" font-size="11" font-weight="600" text-anchor="end">75%</text>

      <!-- Task 3 -->
      <rect x="20" y="265" width="260" height="65" rx="8" fill="#191c24" opacity="0.7"/>
      <circle cx="45" cy="297" r="10" fill="#323846"/>
      <text x="70" y="290" fill="#d1d5db" font-size="13" font-weight="600">Group Brainstorming</text>
      <text x="70" y="310" fill="#8e96a8" font-size="11">Starts in 45 mins</text>
      
      <!-- Action Btn -->
      <rect x="20" y="345" width="260" height="20" rx="4" fill="transparent"/>
      <text x="150" y="355" fill="#1e77fd" font-size="12" font-weight="600" text-anchor="middle">+ Add New Study Task</text>
    </g>

    <!-- Bottom Banner in Dashboard -->
    <g transform="translate(0, 485)">
      <rect x="0" y="0" width="880" height="130" rx="12" fill="url(#accent-grad)" opacity="0.9" filter="url(#shadow)"/>
      <text x="40" y="45" fill="#ffffff" font-size="20" font-weight="700">Ready to test your knowledge?</text>
      <text x="40" y="75" fill="#ffffff" font-size="14" opacity="0.9">Explore community-created quizzes or launch the Quiz Editor to challenge your study group.</text>
      <rect x="40" y="90" width="160" height="32" rx="6" fill="#ffffff"/>
      <text x="120" y="111" fill="#1e77fd" font-size="13" font-weight="700" text-anchor="middle">Browse Quizzes →</text>
    </g>
  </g>
</svg>
