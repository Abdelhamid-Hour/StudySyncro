<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#16191f; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e77fd"/>
      <stop offset="100%" stop-color="#9235e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background decorative card -->
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#1f232d" stroke="#2e3440" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Header -->
  <text x="70" y="85" fill="#ffffff" font-size="20" font-weight="700">Collaborative Study Spaces</text>
  <text x="70" y="110" fill="#8e96a8" font-size="13">Join structured groups tailored to your academic goals</text>
  <rect x="430" y="68" width="100" height="30" rx="6" fill="url(#g-grad)"/>
  <text x="480" y="88" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">+ Join Group</text>

  <!-- Group Card 1 -->
  <rect x="70" y="140" width="220" height="180" rx="12" fill="#262b36" stroke="#363c4b" stroke-width="1"/>
  <rect x="85" y="155" width="40" height="40" rx="10" fill="#1e77fd" fill-opacity="0.2"/>
  <circle cx="105" cy="175" r="8" fill="#1e77fd"/>
  <text x="135" y="172" fill="#ffffff" font-size="15" font-weight="600">Computer Science</text>
  <text x="135" y="188" fill="#8e96a8" font-size="11">Data Structures &amp; Algo</text>
  <line x1="85" y1="210" x2="275" y2="210" stroke="#363c4b" stroke-width="1"/>
  <!-- Members avatars -->
  <circle cx="100" cy="245" r="14" fill="#9235e8" stroke="#262b36" stroke-width="2"/>
  <circle cx="120" cy="245" r="14" fill="#1e77fd" stroke="#262b36" stroke-width="2"/>
  <circle cx="140" cy="245" r="14" fill="#27c93f" stroke="#262b36" stroke-width="2"/>
  <circle cx="160" cy="245" r="14" fill="#ffbd2e" stroke="#262b36" stroke-width="2"/>
  <text x="185" y="250" fill="#d1d5db" font-size="12" font-weight="600">+18 online</text>
  <rect x="85" y="275" width="190" height="30" rx="6" fill="#1e77fd" fill-opacity="0.15"/>
  <text x="180" y="294" fill="#4fa0ff" font-size="12" font-weight="600" text-anchor="middle">Enter Group Space →</text>

  <!-- Group Card 2 -->
  <rect x="310" y="140" width="220" height="180" rx="12" fill="#262b36" stroke="#363c4b" stroke-width="1"/>
  <rect x="325" y="155" width="40" height="40" rx="10" fill="#9235e8" fill-opacity="0.2"/>
  <circle cx="345" cy="175" r="8" fill="#9235e8"/>
  <text x="375" y="172" fill="#ffffff" font-size="15" font-weight="600">Calculus II Prep</text>
  <text x="375" y="188" fill="#8e96a8" font-size="11">Integration Techniques</text>
  <line x1="325" y1="210" x2="515" y2="210" stroke="#363c4b" stroke-width="1"/>
  <circle cx="340" cy="245" r="14" fill="#ff5f56" stroke="#262b36" stroke-width="2"/>
  <circle cx="360" cy="245" r="14" fill="#1e77fd" stroke="#262b36" stroke-width="2"/>
  <text x="390" y="250" fill="#d1d5db" font-size="12" font-weight="600">+8 online</text>
  <rect x="325" y="275" width="190" height="30" rx="6" fill="#9235e8" fill-opacity="0.15"/>
  <text x="420" y="294" fill="#c385ff" font-size="12" font-weight="600" text-anchor="middle">Enter Group Space →</text>
</svg>
